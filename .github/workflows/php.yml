name: PHP Composer

on:
  push:
    branches:
      - main
      - "[0-9]+.[0-9]+"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The S3 connect-timeout test needs libcurl >= 8.11 (Debian trixie: 8.14); the runner's Ubuntu 24.04 has 8.5.
    container: php:8.5-cli-trixie
    env:
      COMPOSER_CACHE_DIR: /tmp/composer-cache

    steps:
      - name: Install system tools and Composer
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip libpng-dev libjpeg62-turbo-dev
          docker-php-ext-configure gd --with-jpeg
          docker-php-ext-install -j"$(nproc)" gd
          curl -fsSL https://getcomposer.org/download/latest-2.x/composer.phar -o /usr/local/bin/composer
          chmod +x /usr/local/bin/composer
          echo 'memory_limit=-1' > /usr/local/etc/php/conf.d/ci.ini

      - name: Show PHP and libcurl versions
        run: php -r 'echo PHP_VERSION, " libcurl ", curl_version()["version"], PHP_EOL;'

      - uses: actions/checkout@v7

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: |
            vendor
            /tmp/composer-cache/files
          key: ${{ runner.os }}-php-8.5-trixie-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-trixie-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run test suite
        run: composer run-script test

      - name: Run PHPStan
        run: composer run-script analyse

      - name: Run PHP-CS-Fixer
        run: composer run-script cs-check
